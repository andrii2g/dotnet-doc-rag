name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore DotnetDocRag.slnx --configfile NuGet.Config
      - name: Build
        run: dotnet build DotnetDocRag.slnx --no-restore -c Release
      - name: Test
        run: dotnet test DotnetDocRag.slnx --no-build -c Release
      - name: Validate Docker Compose
        run: docker compose config
